project_id = "fanta-claus-local"

[api]
enabled = true
port = 54321
schemas = ["fc_api"]
extra_search_path = ["extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_expiry = 3600
otp_length = 6

[auth.email.template.magic_link]
subject = "Accedi a Fanta Claus"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.confirmation]
subject = "Verifica la tua email per Fanta Claus"
content_path = "./supabase/templates/magic-link.html"

[analytics]
enabled = false
